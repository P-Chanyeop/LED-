server:
  port: 8080

spring:
  application:
    name: led-estimate-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:file:./data/leddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

frontend:
  auto-start: true
  project-root: ".."

google:
  sheets:
    id: ${GOOGLE_SHEETS_ID:your-spreadsheet-id}

cors:
  allowed-origins: "*"
